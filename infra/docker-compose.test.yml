name: fivondronana-tests

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fivondronana_test
      POSTGRES_USER: fivondronana_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set an isolated test password}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fivondronana_test -d fivondronana_test"]
      interval: 2s
      timeout: 3s
      retries: 30
